<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Someone Was Here</title>
  </head>
  <body>
    <main class="surface">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <section class="landing" aria-labelledby="page-title">
        <p class="system-note">fictional surface / local archive</p>
        <h1 id="page-title">Someone was here.</h1>
        <p class="subtitle">A shared digital surface where only traces remain.</p>
        <p class="instruction">Click a profile to inspect what is left.</p>
      </section>

      <section class="archive-layout">
        <section class="avatar-wall" aria-label="Absent profile traces" id="avatar-wall"></section>
        <aside class="inspection-panel" aria-live="polite" id="inspection-panel"></aside>
      </section>

      <p class="reflection">How much information needs to remain before a later viewer senses that someone was here?</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
